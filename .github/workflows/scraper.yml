name: Run All India Jobs Scraper

on:
  schedule:
    # Every 3 hours. GitHub Actions cron is UTC.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scraper/**"
      - ".github/workflows/scraper.yml"

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: GitHub Actions secret SUPABASE_URL is missing or empty."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ERROR: GitHub Actions secret SUPABASE_SERVICE_ROLE_KEY is missing or empty."
            echo "The scraper writes to public.updates and RLS correctly blocks the anon key."
            echo "Add the Supabase service_role key as SUPABASE_SERVICE_ROLE_KEY in GitHub repository secrets."
            exit 1
          fi

          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "ERROR: SUPABASE_URL is present but does not look like a Supabase project URL."
              exit 1
              ;;
          esac

          echo "OK: SUPABASE_URL is present."
          echo "OK: SUPABASE_SERVICE_ROLE_KEY is present (value hidden)."

      - name: Run collectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python main.py
