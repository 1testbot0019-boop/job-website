name: Run Uttarakhand Jobs Scraper

on:
  schedule:
    # Every 3 hours. GitHub Actions cron is UTC; adjust as you like.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collectors
        env:
          SUPABASE_URL: "https://pglxtutlkavrtwndnuul.supabase.co"
          SUPABASE_KEY: "sb_publishable_LvTCyvUVJvZt6kvL1RAv8w_H_SEKhdQ"
        run: python main.py
